<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0;url=https://tidal-guardian-angel.github.io/">
  <link rel="canonical" href="https://tidal-guardian-angel.github.io/">
  <title>前往品牌新网址｜潮汐纪年社</title>
  <style>
    :root{color-scheme:light;--page:#f2eef5;--surface:#fffcff;--ink:#3b3345;--muted:#716079;--accent:#745a7d;--accent-dark:#61476b;--line:#ded5e5}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100svh;margin:0;display:grid;place-items:center;padding:28px 18px;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
    main{width:min(100%,620px);padding:clamp(28px,7vw,56px);border:1px solid var(--line);border-radius:22px;background:var(--surface)}
    .brand{margin:0 0 20px;color:var(--accent);font-size:13px;letter-spacing:.14em}
    h1{margin:0;font-family:"Songti SC","Noto Serif CJK SC","STSong",serif;font-size:clamp(27px,6vw,36px);font-weight:400;line-height:1.5}
    .status{margin:16px 0 26px;color:var(--muted);font-size:15px}
    .action{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 20px;border:1px solid var(--accent-dark);border-radius:10px;background:var(--accent);color:#fff;text-align:center;font-size:16px;text-decoration:none}
    .action:hover{background:var(--accent-dark)}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
    .address{display:block;margin-top:17px;color:var(--accent-dark);font-size:14px;text-align:center;text-underline-offset:4px;overflow-wrap:anywhere}
    .note{margin:25px 0 0;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="brand">潮汐纪年社出品</p>
    <h1 id="title">守护天使名号计算器<br>已启用品牌新网址</h1>
    <p class="status" role="status">正在前往新网站。如未自动跳转，请点击下方链接。</p>
    <a class="action" href="https://tidal-guardian-angel.github.io/" rel="noreferrer">前往新网站</a>
    <a class="address" href="https://tidal-guardian-angel.github.io/" rel="noreferrer">https://tidal-guardian-angel.github.io/</a>
    <p class="note">请收藏新网址，之后可直接打开使用。</p>
  </main>
  <script>
    // Fixed destination: never forward the old URL's query or fragment.
    window.location.replace('https://tidal-guardian-angel.github.io/');
  </script>
</body>
</html>
